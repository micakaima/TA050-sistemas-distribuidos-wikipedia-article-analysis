services:
  client_0:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    container_name: client_0
    depends_on:
      - column_filter
    environment:
      - INPUT_DIR=/input/input_0
      - OUTPUT_DIR=/output/output_0
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - BATCH_SIZE=5
    volumes:
      - ./data/input:/input
      - ./data/output:/output
  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - INPUT_QUEUE=raw_articles_queue
      - OUTPUT_QUEUE=results_queue
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  column_filter:
    build:
      context: .
      dockerfile: src/workers/column_filter/Dockerfile
    container_name: column_filter
    depends_on:
      - vocabulary_extractor
      - year_filter
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=raw_articles_queue
      - OUTPUT_QUEUE_Q1_TO_Q2=q1q2_queue
      - OUTPUT_QUEUE_Q3_TO_Q5=q3q5_queue

  vocabulary_extractor:
    build:
      context: .
      dockerfile: src/workers/vocabulary_extractor/Dockerfile
    container_name: vocabulary_extractor
    depends_on:
      - year_splitter
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=q3q5_queue
      - OUTPUT_QUEUE_Q3=q3_queue
      - OUTPUT_QUEUE_Q4=q4_queue
      - OUTPUT_QUEUE_Q5=q5_queue
  
  year_splitter:
    build:
      context: .
      dockerfile: src/workers/year_splitter/Dockerfile
    container_name: year_splitter
    depends_on:
      - old_articles_averager
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=q5_queue
      - OUTPUT_QUEUE_OLD=old_articles_queue
      - OUTPUT_QUEUE_NEW=new_articles_queue
  
  old_articles_averager:
    build:
      context: .
      dockerfile: src/workers/old_articles_averager/Dockerfile
    container_name: old_articles_averager
    depends_on:
      - above_average_filter
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=old_articles_queue
      - OUTPUT_QUEUE=average_queue
  
  above_average_filter:
    build:
      context: .
      dockerfile: src/workers/above_average_filter/Dockerfile
    container_name: above_average_filter
    depends_on:
      - gateway
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE_DATA=new_articles_queue
      - INPUT_QUEUE_AVERAGE=average_queue
      - OUTPUT_QUEUE=results_queue

  year_filter:
    build:
      context: .
      dockerfile: src/workers/year_filter/Dockerfile
    container_name: year_filter
    depends_on:
      - english_filter
      - bio_filter
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=q1q2_queue
      - OUTPUT_EXCHANGE=year_filtered_exchange
      - ROUTING_KEYS=english,bio
      - YEAR=2020

  english_filter:
    build:
      context: .
      dockerfile: src/workers/english_filter/Dockerfile
    container_name: english_filter
    depends_on:
      - result_aggregator
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_EXCHANGE=year_filtered_exchange
      - OUTPUT_QUEUE=q1_results_queue
      - ROUTING_KEYS=english

  bio_filter:
    build:
      context: .
      dockerfile: src/workers/bio_filter/Dockerfile
    container_name: bio_filter
    depends_on:
      - image_downloader
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_EXCHANGE=year_filtered_exchange
      - OUTPUT_QUEUE=image_download_queue
      - ROUTING_KEYS=bio
    
  image_downloader:
    build:
      context: .
      dockerfile: src/workers/image_downloader/Dockerfile
    container_name: image_downloader
    depends_on:
      - result_aggregator
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=image_download_queue
      - OUTPUT_QUEUE=q2_results_queue

  result_aggregator:
    build:
      context: .
      dockerfile: src/workers/result_aggregator/Dockerfile
    container_name: result_aggregator
    depends_on:
      - gateway
    volumes:
      - ./data/storage:/app/storage
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - Q1_INPUT_QUEUE=q1_results_queue
      - Q2_INPUT_QUEUE=q2_results_queue
      - OUTPUT_QUEUE=results_queue
      - STORAGE_DIR=/app/storage
