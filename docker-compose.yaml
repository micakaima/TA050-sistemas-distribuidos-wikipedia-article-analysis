services:
  client_0:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    container_name: client_0
    depends_on:
    - load_balancer
    environment:
    - INPUT_DIR=/input/input_0
    - OUTPUT_DIR=/output/output_0
    - LOAD_BALANCER_HOST=load_balancer
    - LOAD_BALANCER_PORT=5678
    - CONNECTION_ATTEMPS=10
    - CONNECTION_ATTEMPTS_DELAY_MS=1000
    - BATCH_SIZE=50
    volumes:
    - ./data/input:/input
    - ./data/output:/output
  client_1:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    container_name: client_1
    depends_on:
    - load_balancer
    environment:
    - INPUT_DIR=/input/input_1
    - OUTPUT_DIR=/output/output_1
    - LOAD_BALANCER_HOST=load_balancer
    - LOAD_BALANCER_PORT=5678
    - CONNECTION_ATTEMPS=10
    - CONNECTION_ATTEMPTS_DELAY_MS=1000
    - BATCH_SIZE=50
    volumes:
    - ./data/input:/input
    - ./data/output:/output
  client_2:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    container_name: client_2
    depends_on:
    - load_balancer
    environment:
    - INPUT_DIR=/input/input_2
    - OUTPUT_DIR=/output/output_2
    - LOAD_BALANCER_HOST=load_balancer
    - LOAD_BALANCER_PORT=5678
    - CONNECTION_ATTEMPS=10
    - CONNECTION_ATTEMPTS_DELAY_MS=1000
    - BATCH_SIZE=50
    volumes:
    - ./data/input:/input
    - ./data/output:/output
  gateway_0:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    container_name: gateway_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - SERVER_HOST=gateway_0
    - SERVER_PORT=5679
    - OUTPUT_QUEUE=results
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - COLUMN_FILTER_AMOUNT=2
    - COLUMN_FILTER_PREFIX=raw_articles
    - GATEWAY_PREFIX=gateway
  gateway_1:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    container_name: gateway_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - SERVER_HOST=gateway_1
    - SERVER_PORT=5679
    - OUTPUT_QUEUE=results
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - COLUMN_FILTER_AMOUNT=2
    - COLUMN_FILTER_PREFIX=raw_articles
    - GATEWAY_PREFIX=gateway
  load_balancer:
    build:
      context: .
      dockerfile: src/load_balancer/Dockerfile
    container_name: load_balancer
    depends_on:
    - gateway_0
    - gateway_1
    - column_filter_0
    - column_filter_1
    environment:
    - LOAD_BALANCER_HOST=load_balancer
    - LOAD_BALANCER_PORT=5678
    - BASE_SERVER_HOST=gateway
    - BASE_SERVER_PORT=5679
    - GATEWAY_AMOUNT=2
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit max_message_size 536870912
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  column_filter_0:
    build:
      context: .
      dockerfile: src/workers/column_filter/Dockerfile
    container_name: column_filter_0
    depends_on:
    - vocabulary_extractor_0
    - vocabulary_extractor_1
    - year_filter_0
    - year_filter_1
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - COLUMN_FILTER_PREFIX=raw_articles
    - YEAR_FILTER_AMOUNT=2
    - YEAR_FILTER_PREFIX=2020_candidates
    - VOCABULARY_EXTRACTOR_AMOUNT=2
    - VOCABULARY_EXTRACTOR_PREFIX=raw_abstracts
  column_filter_1:
    build:
      context: .
      dockerfile: src/workers/column_filter/Dockerfile
    container_name: column_filter_1
    depends_on:
    - vocabulary_extractor_0
    - vocabulary_extractor_1
    - year_filter_0
    - year_filter_1
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - COLUMN_FILTER_PREFIX=raw_articles
    - YEAR_FILTER_AMOUNT=2
    - YEAR_FILTER_PREFIX=2020_candidates
    - VOCABULARY_EXTRACTOR_AMOUNT=2
    - VOCABULARY_EXTRACTOR_PREFIX=raw_abstracts
  vocabulary_extractor_0:
