services:
  client_0:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    container_name: client_0
    depends_on:
      - gateway
    environment:
      - INPUT_DIR=/input/input_0
      - OUTPUT_DIR=/output/output_0
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - BATCH_SIZE=5
    volumes:
      - ./data/input:/input
      - ./data/output:/output
  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    container_name: gateway
    environment:
      - SERVER_HOST=gateway
      - SERVER_PORT=5678

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  column_filter:
    build:
      context: .
      dockerfile: src/workers/column_filter/Dockerfile
    container_name: column_filter
    depends_on:
      - year_filter
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=raw_articles_queue
      - OUTPUT_QUEUE_Q1_TO_Q2=q1q2_queue
      - OUTPUT_QUEUE_Q3_TO_Q5=q3q5_queue

  year_filter:
    build:
      context: .
      dockerfile: src/workers/year_filter/Dockerfile
    container_name: year_filter
    depends_on:
      - english_filter
      - bio_filter
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=q1q2_queue
      - OUTPUT_EXCHANGE=year_filtered_exchange
      - ROUTING_KEYS=english,bio
      - YEAR=2020

  english_filter:
    build:
      context: .
      dockerfile: src/workers/english_filter/Dockerfile
    container_name: english_filter
    depends_on:
      - gateway
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_EXCHANGE=year_filtered_exchange
      - OUTPUT_QUEUE=q1_results_queue
      - ROUTING_KEYS=english

  bio_filter:
    build:
      context: .
      dockerfile: src/workers/bio_filter/Dockerfile
    container_name: bio_filter
    depends_on:
      - gateway
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_EXCHANGE=year_filtered_exchange
      - OUTPUT_QUEUE=image_download_queue
      - ROUTING_KEYS=bio
    
  image_downloader:
    build:
      context: .
      dockerfile: src/workers/image_downloader/Dockerfile
    container_name: image_downloader
    depends_on:
      - gateway
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - INPUT_QUEUE=image_download_queue
      - OUTPUT_QUEUE=q2_results_queue
